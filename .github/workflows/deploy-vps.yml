name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_EPAY_JS_URL: ${{ secrets.NEXT_PUBLIC_EPAY_JS_URL }}
          NEXT_PUBLIC_EPAY_ENV: ${{ secrets.NEXT_PUBLIC_EPAY_ENV }}
          NEXT_PUBLIC_PAYMENTS_MODE: ${{ secrets.NEXT_PUBLIC_PAYMENTS_MODE }}
          NEXT_PUBLIC_SITE_URL: https://uralskflowers.kz
          NEXT_PUBLIC_LEGAL_PAYMENT_ENABLED: 'true'
          NEXT_PUBLIC_HALYK_QR_ENV: 'prod'

      - name: Package artifacts
        run: |
          set -euo pipefail
          tar -czf deploy.tar.gz -C .next/standalone .
          tar -czf static.tar.gz -C .next static
          tar -czf public.tar.gz -C . public
          cp package-lock.json package-lock.release.json
          gzip -t deploy.tar.gz
          gzip -t static.tar.gz
          gzip -t public.tar.gz

          CHECK_DIR="$(mktemp -d)"
          tar -xzf deploy.tar.gz -C "$CHECK_DIR"
          mkdir -p "$CHECK_DIR/.next"
          tar -xzf static.tar.gz -C "$CHECK_DIR/.next"
          tar -xzf public.tar.gz -C "$CHECK_DIR"

          cd "$CHECK_DIR"
          test -f server.js
          test -d .next/server
          test -d .next/static
          test -d public
          find .next/static -type f | grep -q '\.css$'

          python3 - <<'PY'
          import os
          import re
          import sys

          root = os.getcwd()
          patterns = {
              "css": [
                  re.compile(r"/_next/static/[^\"'\s<>]+\.css"),
                  re.compile(r"(?<!/_next/)static/[^\"'\s<>]+\.css"),
              ],
              "js": [
                  re.compile(r"/_next/static/[^\"'\s<>]+\.js"),
                  re.compile(r"(?<!/_next/)static/[^\"'\s<>]+\.js"),
              ],
          }
          missing = []

          def should_scan(path):
              rel = os.path.relpath(path, root).replace(os.sep, "/")
              name = os.path.basename(path)
              ext = os.path.splitext(name)[1]
              if "/chunks/" in rel:
                  return False
              if ext in {".json", ".html", ".rsc"}:
                  return True
              return "manifest" in name and ext == ".js"

          def normalize(asset):
              if asset.startswith("/_next/static/"):
                  return os.path.join(root, ".next", asset[len("/_next/"):])
              if asset.startswith("static/"):
                  return os.path.join(root, ".next", asset)
              return None

          for scan_root in [os.path.join(root, ".next"), os.path.join(root, ".next", "server")]:
              for current_root, _, files in os.walk(scan_root):
                  for name in files:
                      path = os.path.join(current_root, name)
                      if not should_scan(path):
                          continue
                      try:
                          with open(path, "r", encoding="utf-8", errors="ignore") as file:
                              data = file.read()
                      except OSError:
                          continue

                      for kind, kind_patterns in patterns.items():
                          for pattern in kind_patterns:
                              for asset in pattern.findall(data):
                                  local = normalize(asset)
                                  if local and not os.path.isfile(local):
                                      missing.append((kind, asset, local, os.path.relpath(path, root)))

          if missing:
              for kind, asset, local, source in missing[:50]:
                  print(f"Missing {kind} asset: {asset} -> {local} (referenced by {source})", file=sys.stderr)
              print(f"Missing asset count: {len(missing)}", file=sys.stderr)
              sys.exit(1)

          print("ARCHIVE_ASSET_VALIDATION_OK")
          PY

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy.tar.gz,static.tar.gz,public.tar.gz,package-lock.release.json"
          target: /tmp/flowers-upload/${{ github.sha }}

      - name: Deploy release on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: RELEASE_ID
          script: |
            set -euo pipefail

            APP=/srv/flowers-b2b
            RELEASES="$APP/releases"
            SHARED="$APP/shared"
            CURRENT="$APP/current"
            UPLOAD="/tmp/flowers-upload/$RELEASE_ID"
            RELEASE="$RELEASES/$RELEASE_ID"
            PREVIOUS=""

            test -n "$RELEASE_ID"

            if [ -L "$CURRENT" ]; then
              PREVIOUS="$(readlink -f "$CURRENT")"
            fi

            rollback() {
              echo "ROLLBACK_START"
              if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
                ln -sfn "$PREVIOUS" "$CURRENT"
                sudo nginx -t && sudo systemctl reload nginx || true
                pm2 reload flowers-b2b --update-env || true
              fi
              echo "ROLLBACK_DONE"
              exit 1
            }

            trap rollback ERR

            mkdir -p "$RELEASES" "$SHARED"
            test -f "$SHARED/.env.production"

            for archive in deploy.tar.gz static.tar.gz public.tar.gz; do
              test -f "$UPLOAD/$archive"
              gzip -t "$UPLOAD/$archive"
            done

            if [ -e "$RELEASE" ]; then
              echo "Release already exists: $RELEASE" >&2
              exit 1
            fi

            mkdir -p "$RELEASE"

            tar -xzf "$UPLOAD/deploy.tar.gz" -C "$RELEASE"
            mkdir -p "$RELEASE/.next"
            tar -xzf "$UPLOAD/static.tar.gz" -C "$RELEASE/.next"
            tar -xzf "$UPLOAD/public.tar.gz" -C "$RELEASE"
            cp -p "$UPLOAD/package-lock.release.json" "$RELEASE/package-lock.json"
            ln -sfn "$SHARED/.env.production" "$RELEASE/.env.production"
            printf '%s\n' "$RELEASE_ID" > "$RELEASE/COMMIT_HASH"

            cd "$RELEASE"
            test -f server.js
            test -f .next/BUILD_ID
            test -d .next/server
            test -d .next/static
            test -d public
            test -f package.json
            test -f package-lock.json
            test -L .env.production
            find .next/static -type f | grep -q '\.css$'

            python3 - <<'PY'
            import os
            import re
            import sys

            root = os.getcwd()
            patterns = {
                "css": [
                    re.compile(r"/_next/static/[^\"'\s<>]+\.css"),
                    re.compile(r"(?<!/_next/)static/[^\"'\s<>]+\.css"),
                ],
                "js": [
                    re.compile(r"/_next/static/[^\"'\s<>]+\.js"),
                    re.compile(r"(?<!/_next/)static/[^\"'\s<>]+\.js"),
                ],
            }
            missing = []

            def should_scan(path):
                rel = os.path.relpath(path, root).replace(os.sep, "/")
                name = os.path.basename(path)
                ext = os.path.splitext(name)[1]
                if "/chunks/" in rel:
                    return False
                if ext in {".json", ".html", ".rsc"}:
                    return True
                return "manifest" in name and ext == ".js"

            def normalize(asset):
                if asset.startswith("/_next/static/"):
                    return os.path.join(root, ".next", asset[len("/_next/"):])
                if asset.startswith("static/"):
                    return os.path.join(root, ".next", asset)
                return None

            for scan_root in [os.path.join(root, ".next"), os.path.join(root, ".next", "server")]:
                for current_root, _, files in os.walk(scan_root):
                    for name in files:
                        path = os.path.join(current_root, name)
                        if not should_scan(path):
                            continue
                        try:
                            with open(path, "r", encoding="utf-8", errors="ignore") as file:
                                data = file.read()
                        except OSError:
                            continue

                        for kind, kind_patterns in patterns.items():
                            for pattern in kind_patterns:
                                for asset in pattern.findall(data):
                                    local = normalize(asset)
                                    if local and not os.path.isfile(local):
                                        missing.append((kind, asset, local, os.path.relpath(path, root)))

            if missing:
                for kind, asset, local, source in missing[:50]:
                    print(f"Missing {kind} asset: {asset} -> {local} (referenced by {source})", file=sys.stderr)
                print(f"Missing asset count: {len(missing)}", file=sys.stderr)
                sys.exit(1)

            print("ASSET_VALIDATION_OK")
            PY

            sudo nginx -t
            ln -sfn "$RELEASE" "$CURRENT"
            sudo systemctl reload nginx
            pm2 reload flowers-b2b --update-env
            sleep 3
            pm2 status flowers-b2b | grep -q online

            curl -k -fsS https://uralskflowers.kz/ -o /tmp/flowers-root.html
            css_path="$(grep -oE '/_next/static/[A-Za-z0-9._~/-]+\.css' /tmp/flowers-root.html | head -1)"
            test -n "$css_path"
            curl -k -fsS "https://uralskflowers.kz$css_path" -o /tmp/flowers-root.css
            curl -fsS "http://127.0.0.1:3000/api/products?limit=1" -o /tmp/flowers-products.json
            curl -k -fsS https://uralskflowers.kz/robots.txt -o /tmp/flowers-robots.txt
            curl -k -fsS https://uralskflowers.kz/sitemap.xml -o /tmp/flowers-sitemap.xml

            pm2 save
            trap - ERR

            echo "DEPLOYED_RELEASE=$RELEASE"
            echo "PREVIOUS_RELEASE=$PREVIOUS"
            echo "CURRENT=$(readlink -f "$CURRENT")"
            echo "BUILD_ID=$(cat "$CURRENT/.next/BUILD_ID")"
